services:
  postgres:
    image: postgres:16-alpine
    container_name: tvhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvhub
    ports:
      - "5432:5432"
    volumes:
      - tvhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tvhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tvhub-redis
    restart: unless-stopped
    # appendonly: as sessões de reprodução sobrevivem a um restart do container.
    # Sem isso, um reboot do Redis zeraria a contagem e liberaria telas extras.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - tvhub-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tvhub-pgdata:
  tvhub-redisdata:
